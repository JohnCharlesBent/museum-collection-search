# Nginx rules for Laravel Forge (or any Nginx host).
#
# In Forge, open your site's Nginx configuration and, inside the
# `server { ... }` block that has `listen 443` (or the only server block):
#
#   1. REPLACE the existing `location / { ... }` block with the one below.
#   2. DELETE the `location ~ \.php$ { ... }` block (this site has no PHP).
#   3. PASTE the four API blocks below it.
#   4. If you use Harvard, replace YOUR_HARVARD_API_KEY with your key.
#   5. Replace you@example.com with your contact email (the Art Institute asks
#      API users to identify themselves).
#
# Don't commit a copy of this file with your real Harvard key in it.

# The app is a single page: send paths like /stats to index.html.
location / {
    try_files $uri $uri/ /index.html;
}

# Built files have content hashes in their names, so they can be cached long.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Art Institute of Chicago API. It blocks requests made directly from web
# pages, so the server makes them instead.
location /aic/ {
    proxy_pass https://api.artic.edu/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.artic.edu;
    proxy_set_header Cookie "";
    proxy_set_header AIC-User-Agent "museum-collection-search (you@example.com)";
}

# Art Institute of Chicago images (IIIF).
location /iiif/ {
    proxy_pass https://www.artic.edu/iiif/;
    proxy_ssl_server_name on;
    proxy_set_header Host www.artic.edu;
    proxy_set_header Cookie "";
    proxy_set_header AIC-User-Agent "museum-collection-search (you@example.com)";
}

# The Met Collection API.
location /met/ {
    proxy_pass https://collectionapi.metmuseum.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host collectionapi.metmuseum.org;
    proxy_set_header Cookie "";
}

# Harvard Art Museums API. The server adds the key to every request, so it
# never reaches the browser. Leave this block out if you don't use Harvard.
location /harvard/ {
    set $args "${args}&apikey=YOUR_HARVARD_API_KEY";
    proxy_pass https://api.harvardartmuseums.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.harvardartmuseums.org;
    proxy_set_header Cookie "";
}
